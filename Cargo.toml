[workspace]
resolver = "2"
members = [
    "crates/historical-core",
    "crates/binance-vision",
    "crates/binance-vision-cli",
    "crates/kraken-historical",
    "crates/kraken-historical-cli",
    "crates/okx-historical",
    "crates/okx-historical-cli",
    "crates/bybit-historical",
    "crates/bybit-historical-cli",
    "crates/deribit-historical",
    "crates/deribit-historical-cli",
]
default-members = [
    "crates/binance-vision-cli",
    "crates/kraken-historical-cli",
    "crates/okx-historical-cli",
    "crates/bybit-historical-cli",
    "crates/deribit-historical-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Arathi Research"]
repository = "https://github.com/arathi-mercat/historical-rs"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
arrow = { version = "54", default-features = false, features = ["csv"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
clickhouse = { version = "0.13", features = ["time", "inserter", "chrono"] }
csv = "1.3"
directories = "6.0"
flate2 = "1.0"
futures = "0.3"
historical-core = { path = "crates/historical-core" }
indicatif = "0.17"
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
# cookies required by Kraken Drive downloads; harmless for Binance/OKX
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream", "cookies"] }
rust-s3 = { version = "0.35", default-features = false, features = ["with-tokio", "tokio-rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wiremock = "0.6"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
